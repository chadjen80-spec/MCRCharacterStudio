<style>
/* Layout: step bar on top; left = what to add, centre = stage + timeline, right = settings over the AI assistant. One dark workshop look. */
:root{
  --bg:#0b0b10;--panel:#121219;--panel2:#191922;--raise:#22222d;--line:#2a2a36;--line2:#3a3a49;
  --fg:#ecebf2;--muted:#9d9bb0;--dim:#6b6980;
  --accent:#ff3b5c;--accent-2:#ff7a8f;--cyan:#5ee2ff;--amber:#ffb547;--ok:#5ee09a;
  --disp:'Chakra Petch','IBM Plex Sans Thai',system-ui,sans-serif;--body:'IBM Plex Sans Thai','Chakra Petch',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.45 var(--body);overflow:hidden;margin:0}
*{box-sizing:border-box}[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:1px}
#app{display:grid;grid-template-columns:276px minmax(0,1fr) 336px;grid-template-rows:56px minmax(0,1fr);height:100%}
.top{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:linear-gradient(180deg,#15151d,#101016)}
.logo img{display:block;filter:drop-shadow(0 1px 1px #0006)}
.logo{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ffd1d9,var(--accent) 45%,#6d0618);box-shadow:0 0 16px #ff3b5c55;flex:none}
.brand{font:700 16px/1 var(--disp);letter-spacing:.05em;white-space:nowrap}.brand b{color:var(--accent)}
.steps{display:flex;gap:4px;margin-left:12px;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:3px}
.steps button{display:flex;align-items:center;gap:7px;background:none;border:0;border-radius:6px;padding:7px 12px;font:600 13px/1 var(--disp);color:var(--muted);white-space:nowrap}
.steps button i{font:600 10px/1 var(--mono);font-style:normal;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2)}
.steps button.on{background:var(--raise);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}.steps button.on i{background:var(--accent);border-color:var(--accent);color:#fff}
.sp{flex:1}
.btn{background:var(--raise);border:1px solid var(--line2);border-radius:6px;padding:7px 11px;font:600 12.5px/1 var(--disp);white-space:nowrap}
.btn:hover{border-color:#525266}.btn:disabled{opacity:.4;cursor:default}
.btn.red{background:var(--accent);border-color:var(--accent);color:#fff}.btn.red:hover{background:#ff5672}
.btn.sm{padding:5px 9px;font-size:12px}.btn.wide{width:100%;padding:10px}.btn.on{background:#3a1520;border-color:var(--accent);color:#ffd9df}
aside{background:var(--panel);min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.left{border-right:1px solid var(--line);padding:14px}
.right{border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.insp{flex:1;overflow:auto;padding:14px 14px 20px;scrollbar-width:thin}
h3{font:600 11px/1 var(--disp);letter-spacing:.14em;color:var(--muted);margin:18px 0 10px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
h3::after{content:"";flex:1;height:1px;background:var(--line)}h3:first-child{margin-top:0}
.howto{background:#1c1418;border:1px solid #3a2330;border-radius:8px;padding:10px 12px;font-size:12.5px;color:#e6d6de;margin-bottom:12px;line-height:1.55}
.howto b{color:#fff}
.note{font-size:11.5px;color:var(--dim);line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.card{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px;text-align:left;display:flex;flex-direction:column;gap:4px}
.card:hover{border-color:var(--accent)}.card.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card .th{aspect-ratio:1;border-radius:5px;background:#0a0a10 center/contain no-repeat;display:grid;place-items:center;color:var(--dim);font:600 12px var(--mono)}
.card span{font:600 12px/1.15 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px 2px}
.card .tag{position:absolute;top:8px;left:8px;font:600 9px/1 var(--mono);background:#000a;padding:3px 5px;border-radius:3px;color:var(--accent-2)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.chips button{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:5px 10px;font:500 12px/1.2 var(--body);color:#d0cedf}
.chips button.on{background:#3a1520;border-color:var(--accent);color:#ffd9df}
.slot{margin-bottom:10px}.slot label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.list{display:flex;flex-direction:column;gap:4px}
.li{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12.5px;text-align:left}
.li.on{border-color:var(--accent);background:#2a1219}.li .k{font:600 10px var(--mono);color:var(--dim);border:1px solid var(--line2);border-radius:3px;padding:2px 4px}.li .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.center{display:flex;flex-direction:column;min-width:0;min-height:0;padding:12px 16px 10px;gap:8px;overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.title{font:700 20px/1.1 var(--disp)}.eyebrow{font:600 10px/1 var(--disp);letter-spacing:.16em;color:var(--accent-2);text-transform:uppercase}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:3px;gap:2px}
.seg button{background:none;border:0;border-radius:5px;padding:5px 9px;font:600 12px/1 var(--disp);color:var(--muted)}.seg button.on{background:var(--raise);color:var(--fg)}
.vp{position:relative;flex:1;min-height:220px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#0a0a10}
.vp canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{touch-action:none}
.badge{position:absolute;top:10px;left:10px;font:600 10px/1 var(--mono);letter-spacing:.12em;color:#d8d6e6;border:1px solid #ffffff22;background:#0009;padding:6px 8px;border-radius:5px;pointer-events:none}
.stat{position:absolute;bottom:8px;right:10px;font:500 11px/1 var(--mono);color:#ffffff66;pointer-events:none}
.hint2{position:absolute;bottom:8px;left:10px;font-size:11.5px;color:#ffffffaa;background:#0008;padding:5px 8px;border-radius:5px;pointer-events:none}
.transport{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ib{min-width:32px;height:30px;padding:0 9px;display:inline-grid;place-items:center;background:var(--raise);border:1px solid var(--line2);border-radius:6px;font:600 12px/1 var(--disp)}
.ib.on{background:#3a1520;border-color:var(--accent);color:#ffd9df}
.fc{font:600 12px/1 var(--mono);min-width:76px;text-align:center;font-variant-numeric:tabular-nums}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}.chk input{accent-color:var(--accent)}
.tl{border:1px solid var(--line);border-radius:10px;background:var(--panel);display:flex;flex-direction:column;height:200px;flex:none}
.tlh,.trow{display:grid;grid-template-columns:150px minmax(0,1fr)}
.tlh{height:24px;border-bottom:1px solid var(--line);font:500 10px/1 var(--mono);color:var(--dim);align-items:center}
.tlh>span{padding-left:10px}
.ruler{position:relative;height:100%;margin-right:12px;cursor:ew-resize}.ruler i{position:absolute;top:7px;transform:translateX(-50%);font-style:normal}
.rows{overflow-y:auto;overflow-x:hidden;position:relative;flex:1;scrollbar-width:thin}
.trow{height:26px;grid-template-rows:25px;border-bottom:1px solid #ffffff08;cursor:pointer}
.trow.on{background:#2a1219}
.trow .lb{display:flex;align-items:center;gap:6px;padding:0 8px 0 10px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
.trow.on .lb{color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.track{position:relative;margin-right:12px}
.key{position:absolute;top:7px;width:11px;height:11px;transform:translateX(-50%) rotate(45deg);background:#ffb547;border:1px solid #2a1a00;border-radius:2px;cursor:grab}
.key.sel{background:#fff;box-shadow:0 0 0 2px var(--accent)}
.vbar{position:absolute;top:4px;bottom:4px;border-radius:4px;background:linear-gradient(180deg,#6a3341,#4b2230);border:1px solid #8c4558;font:600 10px/16px var(--mono);color:#ffd9df;text-align:center;overflow:hidden;white-space:nowrap;cursor:grab;touch-action:none}
.trow.on .vbar{background:linear-gradient(180deg,#ff3b5c,#d61f3e);border-color:#ff7a8f}
.hitm{position:absolute;top:0;bottom:0;width:2px;background:var(--cyan);opacity:.7;pointer-events:none}
.ph{position:absolute;top:0;bottom:0;width:2px;background:var(--amber);pointer-events:none;box-shadow:0 0 8px var(--amber);z-index:3}
.empty{padding:16px;color:var(--dim);text-align:center;font-size:12.5px}
.fld{margin-bottom:10px}.fl{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:3px}.fl label{font-size:12px;color:#d0cedf}
.num{width:72px;background:var(--bg);border:1px solid var(--line2);border-radius:5px;padding:4px 7px;text-align:right;font:500 12px var(--mono)}
input[type=range]{width:100%;accent-color:var(--accent);height:18px;margin:0}
.crow{display:flex;gap:8px;align-items:center}.crow input[type=color]{width:34px;height:28px;border:1px solid var(--line2);border-radius:6px;background:none;padding:2px;flex:none}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cgrid .crow label{font-size:12px;color:#d0cedf}
.fsel,.txt{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:7px 9px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;font-size:12px;color:#d0cedf}.tog input{accent-color:var(--accent);width:16px;height:16px}
.lint{display:flex;flex-direction:column;gap:6px}.lint div{font-size:12px;border-left:3px solid var(--amber);background:#1d1912;padding:7px 9px;border-radius:0 6px 6px 0}.lint div.ok{border-color:var(--ok);background:#12201a}
/* assistant */
.ai{border-top:1px solid var(--line);background:#0f0f15;display:flex;flex-direction:column;height:46%;min-height:250px}
.aih{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}
.aih b{font:700 13px var(--disp)}.dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.meter{font:500 10.5px/1.4 var(--mono);color:var(--muted);padding:6px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
.meter b{color:var(--fg);font-weight:600}.meter .sv{color:var(--ok)}
.log{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin}
.msg{font-size:12.5px;line-height:1.5;padding:7px 10px;border-radius:8px;max-width:95%;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:#2a1219;border:1px solid #4a2333}
.msg.a{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
.msg .via{display:block;font:600 10px/1.4 var(--mono);color:var(--dim);margin-top:4px}.msg .via.local{color:var(--ok)}.msg .via.ai{color:var(--cyan)}
.sugg{display:flex;gap:5px;flex-wrap:wrap;padding:0 12px 6px}.sugg button{background:none;border:1px dashed var(--line2);border-radius:99px;padding:3px 9px;font-size:11.5px;color:var(--muted)}
.ask{display:flex;gap:6px;padding:8px 12px 12px}.ask input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:8px 10px}
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--panel);border:1px solid var(--line2);border-radius:12px;width:min(680px,100%);max-height:90vh;overflow:auto;padding:20px}
.dlg h2{font:700 19px var(--disp);margin:0 0 6px}.dlg ol{padding-left:20px;margin:8px 0}.dlg li{margin-bottom:7px;font-size:13px;line-height:1.55}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.out{max-width:100%;border:1px solid var(--line2);border-radius:6px;background:repeating-conic-gradient(#1b1a22 0 25%,#121218 0 50%) 0 0/16px 16px}
textarea.txt{min-height:110px;font:12px/1.5 var(--body)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--accent);padding:10px 16px;border-radius:7px;z-index:60;box-shadow:0 10px 30px #000a;font-size:13px}
/* quick sprite page */
.steps button.q i{border-color:#ff3b5c;color:#ffc2cd}.steps button.q.on i{background:#ff3b5c;border-color:#ff3b5c;color:#fff}
.quick{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px;align-content:start;scrollbar-width:thin}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.qcard.wide{grid-column:1/-1}.qh{display:flex;align-items:center;gap:10px}.qh h4{margin:0;font:700 17px var(--disp);flex:1}
#qPrev{width:100%;aspect-ratio:16/9;border-radius:8px;image-rendering:pixelated;background:#000;display:block}
.qstrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}.qstrip button{flex:none;background:var(--panel2);border:2px solid var(--line);border-radius:7px;padding:3px 3px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 11px var(--mono);color:var(--muted)}
.qstrip button.on{border-color:#ff7a8f;color:#fff}.qstrip canvas{width:54px;height:54px;image-rendering:pixelated;border-radius:4px;background:#86b8a0}
.qscrub{display:flex;align-items:center;gap:10px}.qscrub input{accent-color:#ff7a8f}
.qctl{display:flex;gap:10px;justify-content:center}.qctl button{width:44px;height:40px;border-radius:9px;background:var(--raise);border:1px solid var(--line2);font-size:16px}.qctl button.on{background:#ff3b5c;border-color:#ff7a8f;color:#fff}
.gen{width:100%;padding:16px 14px;border:0;border-radius:11px;background:linear-gradient(135deg,#ff5a75,#d61f3e);color:#fff;font:700 18px/1.2 var(--disp);box-shadow:0 8px 24px #d61f3e44;display:flex;align-items:center;justify-content:center;gap:10px}
.gen:disabled{opacity:.6}.gen:hover{filter:brightness(1.08)}
.dz{border:1.5px dashed var(--line2);border-radius:10px;padding:12px;text-align:center;color:var(--muted);background:var(--panel2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.dz.drag{border-color:#ff3b5c;background:#2a0f17}.dz img{max-width:100%;max-height:140px;image-rendering:auto}.dz strong{color:var(--fg);font:600 14px var(--disp)}
.qsheet{overflow:auto;border-radius:8px;background:repeating-conic-gradient(#1b1a22 0 25%,#121218 0 50%) 0 0/16px 16px}.qsheet canvas{display:block;image-rendering:pixelated}
.pal{display:flex;flex-wrap:wrap;gap:3px}.pal span{width:16px;height:16px;border-radius:3px;border:1px solid #0008}
@media (max-width:1150px){.quick{grid-template-columns:1fr}}
.picker{position:relative;border:1px solid var(--line2);border-radius:6px;overflow:hidden;background:#000;cursor:crosshair;margin-bottom:8px}.picker canvas{display:block;width:100%}
@media (max-width:1150px){#app{grid-template-columns:240px minmax(0,1fr) 300px}.steps button span{display:none}}
@media (max-width:900px){body{overflow:auto}#app{grid-template-columns:1fr;grid-template-rows:auto;height:auto}.top{flex-wrap:wrap;height:auto;padding-block:8px}.steps{order:5;width:100%;margin:0;overflow-x:auto}
  .left,.right{border:0;border-top:1px solid var(--line)}.left{order:2}.right{order:3}.center{order:1;overflow:visible}.vp{flex:none;height:52vh}.ai{height:420px}.center .bar>div:first-child{flex-basis:100%}
  .left,.insp,.center{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* globals the VFX engine reads */

/* ============================================================ state */
const TX=3.1; // where the practice target stands
let S={name:'Kage · นินจาเงา',source:'vector',dna:{seed:7,slots:{...ARCHETYPES.ninja.slots},colors:{...ARCHETYPES.ninja.colors}},img:{cols:6,rows:4,cell:6,flip:false,weaponTip:false},kp:null,clips:[],clipId:null,tab:'quick'};

let RIG=defaultRig(),PARTS=[],CH=null,TG=null;

/* ============================================================ three stage */
const vp=$('#vp'),cv=$('#cv'),ov=$('#ov'),oc=ov.getContext('2d');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true,preserveDrawingBuffer:true});const PR=Math.min(devicePixelRatio||1,1.5);renderer.setPixelRatio(PR);
const scene=new THREE.Scene();scene.background=new THREE.Color('#0a0a10');
const camera=new THREE.PerspectiveCamera(32,1,.05,200);camera.position.set(.9,1.45,9.6);camera.lookAt(.9,1.25,0);
const grid=new THREE.GridHelper(30,60,0x3a3248,0x1d1a26);grid.material.transparent=true;grid.material.opacity=.7;scene.add(grid);
const shadowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(0,0,0,.55)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);})();
function shadow(){const m=new THREE.Mesh(new THREE.PlaneGeometry(1.4,.32),new THREE.MeshBasicMaterial({map:shadowTex,transparent:true,depthWrite:false,depthTest:false}));m.renderOrder=5;return m;}
const charRoot=new THREE.Group(),tgtRoot=new THREE.Group(),fxRoot=new THREE.Group();scene.add(charRoot,tgtRoot,fxRoot);
const shA=shadow(),shB=shadow();scene.add(shA,shB);
tgtRoot.position.x=TX;tgtRoot.scale.x=-1;
scene.add(new THREE.AmbientLight(0xffffff,.6));const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(3,6,5);scene.add(dl);
const composer=new THREE.EffectComposer(renderer);composer.addPass(new THREE.RenderPass(scene,camera));const bloom=new THREE.UnrealBloomPass(new THREE.Vector2(800,450),.9,.45,.98);composer.addPass(bloom);
const VST={px:{value:300},texFor:()=>null};
function resize(){const w=vp.clientWidth,h=vp.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);composer.setPixelRatio(PR);composer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();ov.width=w*PR;ov.height=h*PR;VST.px.value=h*PR/(2*Math.tan(camera.fov*D2R/2));}
new ResizeObserver(resize).observe(vp);

/* ============================================================ character build */
let charKey='';

  (()=>{const o=h('ol');['<b>ทำในเครื่องก่อน (0 token):</b> คำสั่งที่พบบ่อย เช่น “ผมสีแดง”, “วิ่งเร็ว”, “ใหญ่ขึ้น” แปลด้วยกฎในเครื่อง เรียก AI เฉพาะคำสั่งที่กฎไม่เข้าใจ','<b>ให้ AI เลือกจากตัวเลือก ไม่ใช่วาดเอง:</b> ตัวละครคือการเลือกชิ้นจากตู้เสื้อผ้า + สี ส่วน VFX คือคำสั่งสั้นๆ อย่าง add / set / preset คำตอบจึงสั้นและเหมือนเดิมทุกครั้ง','<b>ส่งสถานะแบบย่อ:</b> ส่งแค่บรรทัดสรุปของเลเยอร์หรือชุด ไม่ส่ง JSON ทั้งก้อน · prompt ส่วนใหญ่อยู่ราว 300–700 token','<b>รูปย่อ + พิกัดตัวเลข:</b> การหาข้อต่อส่งรูปย่อ 384px และขอแค่ 18 จุดบนตาราง 0–1000 จากนั้นโค้ดตัดชิ้นส่วนและทำ mesh เอง','<b>เลือกขนาดโมเดลตามงาน:</b> งานเลือกตัวเลือกใช้รุ่นเร็ว (quick) งานท่าทางกับดูรูปใช้รุ่นมาตรฐาน','<b>แคชคำตอบ:</b> สั่งซ้ำแบบเดิมไม่เสีย token (เก็บไว้ 24 ชม. และจำไว้ในเครื่อง 40 รายการล่าสุด)','<b>ตรวจและซ่อมในเครื่อง ไม่ถามซ้ำ:</b> มุมที่เกินขอบเขตข้อต่อถูกตัดให้อยู่ในช่วง ค่าที่ผิดรูปแบบถูกข้าม ทำให้ผลสม่ำเสมอแม้ AI จะตอบไม่เหมือนเดิม','<b>ตรวจงานด้วยกฎ:</b> “ตรวจงาน” ของ VFX (จังหวะโดน ช่องว่าง ความสว่าง ประสิทธิภาพ) ทำในเครื่องทั้งหมด'].forEach(t=>{const li=h('li');li.innerHTML=t;o.append(li);});return o;})(),
  h('div',{class:'note'},'มาตรวัดใต้หัวข้อ “ผู้ช่วย AI” แสดงจำนวน token โดยประมาณที่ใช้ และที่ประหยัดได้จากการทำในเครื่องกับแคช'),h('div',{class:'acts'},h('button',{class:'btn red',onclick:closeModal},'เข้าใจแล้ว')));

/* ============================================================ loop */
function poseAll(c,f,cam){if(!CH)return;const p=clipPose(S.tab==='char'||S.tab==='rig'?idleClip:c,f,RIG);if(S.tab==='rig')Object.assign(p,restPose());CH.apply(p);
  shA.position.set(p.x,0.001,0);shA.rotation.x=-Math.PI/2;shA.scale.setScalar(1-clamp(p.y,0,1.2)*.4);
  if(TG){let tp;const tc=c&&c.hit!=null&&S.tab!=='char'&&S.tab!=='rig'?f-c.hit:-1;tp=tc>=0&&tc<hurtClip.frames?clipPose(hurtClip,tc,RIG):clipPose(idleClip,f+11,RIG);TG.apply(tp);shB.position.set(TX-tp.x,0.001,0);shB.rotation.x=-Math.PI/2;}
  if(c&&S.tab!=='char'&&S.tab!=='rig'){evalFX(c,f,cam);fxRoot.visible=true;}else fxRoot.visible=false;}
const idleClip=makeClip('idle'),hurtClip=makeClip('hurt');
let lastT=performance.now(),acc=0,nf=0;
function tick(now){const dt=Math.min(.1,(now-lastT)/1000);lastT=now;acc+=dt;nf++;const c=clip();
  if(playing){frame+=dt*30*speed;const end=S.tab==='vfx'||rec?(c?Math.max(c.frames,...c.vfx.map(l=>l.end)):60):(c?c.frames:60);
    if(rec&&frame>=rec.end){frame=rec.end;playing=false;updPlay();const r=rec;rec=null;setTimeout(()=>r.mr.stop(),100);}
    else if(frame>end){if(loopOn)frame=frame%Math.max(1,end);else{frame=end;playing=false;updPlay();}}}
  if(S.tab==='char'||S.tab==='rig')frame=(frame)%idleClip.frames;
  if(S.tab==='quick'){quickTick(dt);requestAnimationFrame(tick);return;}
  poseAll(c,frame,camera);composer.render();drawOverlay();
  $('#tFrame').textContent=Math.round(frame)+' / '+(c?c.frames:0);updPh();
  if(acc>.5){$('#stat').textContent=Math.round(nf/acc)+' fps · '+PARTS.length+' ชิ้น · '+RIG.length+' กระดูก';acc=0;nf=0;}requestAnimationFrame(tick);}

/* ============================================================ boot */
async function loadSampleChar(){const C=window.CHAR_SAMPLE;if(!C)return;S.img={cols:1,rows:1,cell:0,flip:false,weaponTip:false};await loadSheetSrc(C.src,false);S.source='image';S.name=C.name;const map=imgMap(IMG.cell),K={};for(const k of KP)K[k]=C.kp[k]?map.toW(C.kp[k][0],C.kp[k][1]):null;S.kp=K;QS().mode='char';}
(async function boot(){const sv=store.get('forge.char2');if(sv&&sv.S&&sv.S.dna){S=sv.S;if(sv.img)await loadSheetSrc(sv.img,false);}else await loadSampleChar();
  if(!S.clips.length){const a=makeClip('slash');a.vfx=defaultFX(a);S.clips.push(a,makeClip('idle'),makeClip('run'));S.clipId=a.id;}
  resize();buildCharacter(true);buildFX(true);go('quick');commit();updPlay();
  say('สวัสดี! บอกสิ่งที่อยากได้ในแต่ละขั้นได้เลย ผมจะทำในเครื่องก่อน (ไม่เสีย token) และเรียก AI เฉพาะเมื่อจำเป็น',null,'a');
  requestAnimationFrame(tick);setTimeout(()=>{if(S.tab==='quick'&&!QR)quickGenerate();},300);
  await AIH.init();if(!AIH.ns)say('ตอนนี้ AI ยังไม่พร้อมในหน้านี้ (ใช้ได้เมื่อเปิดใน claude.ai) · คำสั่งพื้นฐานยังใช้ได้ครบ',null,'a');})();
