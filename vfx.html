<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>VFX Forge Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: three-pane editor — effect library | stage + timeline | layer inspector. One committed dark "forge" look. */
:root{
  --bg:#0c0a0f; --panel:#131016; --panel2:#1a161e; --raise:#221d27; --line:#2d2633; --line2:#3a3141;
  --fg:#eee8f0; --muted:#a095aa; --dim:#6e6478;
  --accent:#ff3b5c; --accent-2:#ff7a8f; --accent-ink:#1c0308; --amber:#ffb547; --ok:#5ee09a;
  --disp:'Chakra Petch','IBM Plex Sans Thai',system-ui,sans-serif;
  --body:'IBM Plex Sans Thai','Chakra Petch',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.45 var(--body);overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:1px}
#app{display:grid;grid-template-columns:262px minmax(0,1fr) 318px;grid-template-rows:58px minmax(0,1fr);height:100%}

/* header */
.top{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:linear-gradient(180deg,#17121a,#110e14)}
.logo{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ffd1d9,var(--accent) 45%,#6d0618);box-shadow:0 0 18px #ff3b5c66}
.logo svg{width:20px;height:20px}
.brand{font:700 17px/1 var(--disp);letter-spacing:.06em;white-space:nowrap}
.brand b{color:var(--accent)}
.chip{font:600 10px/1 var(--mono);letter-spacing:.12em;color:var(--muted);border:1px solid var(--line2);padding:5px 8px;border-radius:4px;white-space:nowrap}
.sp{flex:1}
.btn{background:var(--raise);border:1px solid var(--line2);border-radius:6px;padding:7px 12px;font:600 13px/1 var(--disp);white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:#2c2532;border-color:#4a3e53}
.btn:disabled{opacity:.4;cursor:default}
.btn.red{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.red:hover{background:#ff5672}
.btn.hot{background:linear-gradient(180deg,#ff5672,#d61f3e);border-color:#ffd1d9;color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.drop{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:6px;min-width:230px;z-index:30;box-shadow:0 12px 32px #000a;display:flex;flex-direction:column;gap:2px}
.menu button{background:none;border:0;text-align:left;padding:9px 10px;border-radius:5px}
.menu button:hover{background:var(--raise)}
.menu small{display:block;color:var(--muted);font-size:11px}

/* panels */
aside{background:var(--panel);min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.left{border-right:1px solid var(--line);padding:16px 14px}
.right{border-left:1px solid var(--line);padding:16px 16px 40px}
.ptitle{font:600 11px/1 var(--disp);letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin:0 0 12px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:10px}
.tabs button{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:7px 2px;font:600 12px/1.1 var(--disp)}
.tabs button.on{background:#3a1520;border-color:var(--accent);color:#ffd9df}
.search{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:9px 11px}
.hint{color:var(--dim);font-size:11px;margin:7px 0 10px}
.libgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.chips{grid-column:1/-1;display:flex;gap:5px;flex-wrap:wrap}
.chips button{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px 11px;font:600 12px/1.2 var(--disp);color:var(--muted)}
.chips button.on{background:#3a1520;border-color:var(--accent);color:#ffd9df}
.card{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px;text-align:left;display:flex;flex-direction:column;gap:5px;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card .th{aspect-ratio:1;border-radius:5px;background:#07060a center/cover no-repeat;display:grid;place-items:center;color:var(--dim);font:600 22px var(--disp);overflow:hidden}
.card .th img{width:100%;height:100%;object-fit:cover}
.card span{font:600 12px/1.15 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px 2px}
.card .tag{position:absolute;top:8px;left:8px;font:600 9px/1 var(--mono);background:#000a;padding:3px 5px;border-radius:3px;color:var(--accent-2);letter-spacing:.08em}
.card.up .th{border:1px dashed var(--line2);font-size:13px;text-align:center;padding:8px;line-height:1.3}
.card .x{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:4px;border:0;background:#000b;color:var(--muted);font-size:12px;line-height:1;display:none}
.card:hover .x{display:block}

/* reference panel */
.refbox{display:flex;flex-direction:column;gap:10px}
.dz{border:1px dashed var(--line2);border-radius:8px;padding:18px 12px;text-align:center;color:var(--muted);background:var(--panel2)}
.dz strong{display:block;color:var(--fg);font:600 14px var(--disp);margin-bottom:4px}
.dz.drag{border-color:var(--accent);background:#2a0f17}
.refimg{width:100%;border-radius:6px;border:1px solid var(--line);background:#000}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:6px;border:2px solid #0006}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px;color:var(--muted)}
.kv b{color:var(--fg);font-weight:500}

/* center */
.center{display:flex;flex-direction:column;min-width:0;min-height:0;padding:14px 18px 12px;gap:10px;overflow:hidden}
.mixbar{display:grid;grid-template-columns:minmax(0,260px) auto minmax(0,1fr) auto;gap:8px;align-items:center}
.sel{background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:9px 10px;font:600 14px var(--disp);min-width:0}
.prompt{background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:9px 12px;min-width:0}
.comphead{display:flex;align-items:flex-end;gap:12px}
.eyebrow{font:600 10px/1 var(--disp);letter-spacing:.16em;color:var(--accent-2);text-transform:uppercase;margin-bottom:4px}
.cname{background:transparent;border:0;border-bottom:1px solid transparent;font:700 24px/1.15 var(--disp);padding:0;width:100%;min-width:0}
.cname:hover,.cname:focus{border-bottom-color:var(--line2);outline:none}
.saved{font:600 10px/1 var(--mono);color:var(--ok);letter-spacing:.1em;white-space:nowrap;padding-bottom:6px}
.viewbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:3px;gap:2px}
.seg button{background:none;border:0;border-radius:5px;padding:6px 10px;font:600 12px/1 var(--disp);color:var(--muted)}
.seg button.on{background:var(--raise);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.vp{position:relative;flex:1;min-height:200px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#07060a}
.vp canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.vp .badge{position:absolute;top:12px;left:12px;font:600 10px/1 var(--mono);letter-spacing:.14em;color:#d8cfdd;border:1px solid #ffffff22;background:#0008;padding:7px 9px;border-radius:5px;pointer-events:none}
.vp .stat{position:absolute;bottom:10px;right:12px;font:500 11px/1 var(--mono);color:#ffffff66;pointer-events:none}
.vp.dragover{outline:2px dashed var(--accent);outline-offset:-6px}
.transport{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ib{min-width:32px;height:32px;padding:0 9px;display:inline-grid;place-items:center;background:var(--raise);border:1px solid var(--line2);border-radius:6px;font:600 12px/1 var(--disp)}
.ib:hover{border-color:#4a3e53}
.ib.on{background:#3a1520;border-color:var(--accent);color:#ffd9df}
.fc{font:600 12px/1 var(--mono);min-width:86px;text-align:center;font-variant-numeric:tabular-nums}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.chk input{accent-color:var(--accent)}
.mini{background:var(--raise);border:1px solid var(--line2);border-radius:6px;padding:6px 6px;font:600 12px var(--disp)}
.vsep{width:1px;height:22px;background:var(--line2);margin:0 2px}

/* timeline */
.tl{border:1px solid var(--line);border-radius:10px;background:var(--panel);display:flex;flex-direction:column;max-height:34%;min-height:112px}
.tlhead,.row{display:grid;grid-template-columns:210px minmax(0,1fr);align-items:center}
.tlhead{height:26px;border-bottom:1px solid var(--line);font:500 10px/1 var(--mono);color:var(--dim)}
.tlhead .info{padding-left:12px}
.ruler{position:relative;height:100%;cursor:ew-resize;margin-right:12px}
.ruler i{position:absolute;top:8px;transform:translateX(-50%);font-style:normal}
.rows{overflow-y:auto;overflow-x:hidden;position:relative;flex:1;scrollbar-width:thin}
.row{height:34px;grid-template-rows:33px;border-bottom:1px solid #ffffff08;cursor:pointer;align-items:stretch}
.row.sel{background:#2a1219}
.row.sel .rname{color:#fff}
.rl{display:flex;align-items:center;gap:7px;padding:0 8px 0 10px;min-width:0;height:100%;border-left:3px solid transparent}
.row.sel .rl{border-left-color:var(--accent)}
.rl input{accent-color:var(--accent);margin:0}
.rname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:500 12.5px var(--body);color:var(--muted);flex:1}
.ricon{font:600 10px/1 var(--mono);color:var(--dim);border:1px solid var(--line2);border-radius:3px;padding:2px 4px}
.track{position:relative;margin-right:12px}
.bar{position:absolute;top:6px;bottom:6px;border-radius:4px;background:linear-gradient(180deg,#6a3341,#4b2230);border:1px solid #8c4558;font:600 10px/20px var(--mono);color:#ffd9df;text-align:center;overflow:hidden;white-space:nowrap;cursor:grab;touch-action:none}
.row.sel .bar{background:linear-gradient(180deg,#ff3b5c,#d61f3e);border-color:#ff7a8f}
.bar.off{opacity:.35}
.bar::before,.bar::after{content:"";position:absolute;top:0;bottom:0;width:6px;background:#ffffff22;cursor:ew-resize}
.bar::before{left:0}.bar::after{right:0}
.ph{position:absolute;top:0;bottom:0;width:2px;background:var(--amber);pointer-events:none;box-shadow:0 0 8px var(--amber);z-index:3}
.tlempty{padding:18px;color:var(--dim);text-align:center}

/* inspector */
.ins h3{font:600 11px/1 var(--disp);letter-spacing:.14em;color:var(--muted);margin:22px 0 12px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.ins h3::after{content:"";flex:1;height:1px;background:var(--line)}
.ins h3:first-child{margin-top:0}
.nm{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:10px 12px;font:600 17px var(--disp)}
.sub{font-size:11.5px;color:var(--dim);margin:6px 0 10px}
.brow{display:flex;gap:6px;flex-wrap:wrap}
.fld{margin-bottom:12px}
.fl{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:3px}
.fl label{font-size:12px;color:#cfc6d6}
.num{width:76px;background:var(--bg);border:1px solid var(--line2);border-radius:5px;padding:4px 7px;text-align:right;font:500 12px var(--mono);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);height:18px;margin:0}
.crow{display:flex;gap:8px;align-items:center}
.crow input[type=color]{width:38px;height:30px;border:1px solid var(--line2);border-radius:6px;background:none;padding:2px}
.crow .hex{flex:1;background:var(--bg);border:1px solid var(--line2);border-radius:5px;padding:6px 8px;font:500 12px var(--mono);min-width:0}
.fsel{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:7px 9px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;font-size:12px;color:#cfc6d6}
.tog input{accent-color:var(--accent);width:16px;height:16px}
.pals{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:4px 0 12px}
.pals button{height:24px;border-radius:5px;border:1px solid #0008}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid3 .fld{margin:0}
.grid3 .num{width:100%}
.note{font-size:11.5px;color:var(--dim);line-height:1.5}
.picker{position:relative;margin:4px 0 12px;border:1px solid var(--line2);border-radius:6px;overflow:hidden;background:#000;cursor:crosshair}
.picker canvas{display:block;width:100%}
.empty{color:var(--muted);font-size:12.5px;line-height:1.6}
kbd{font:500 10.5px var(--mono);background:var(--raise);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:1px 5px}

/* modal + toast */
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--panel);border:1px solid var(--line2);border-radius:12px;width:min(640px,100%);max-height:90vh;overflow:auto;padding:20px;box-shadow:0 30px 80px #000}
.dlg h2{font:700 19px var(--disp);margin:0 0 4px}
.dlg .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:16px 0}
.dlg label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.dlg label.f input,.dlg label.f select{background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:7px 9px;color:var(--fg)}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.dlg img.out{max-width:100%;border:1px solid var(--line2);border-radius:6px;background:repeating-conic-gradient(#1b1720 0 25%,#120f15 0 50%) 0 0/16px 16px}
.dlg textarea{width:100%;height:140px;background:var(--bg);border:1px solid var(--line2);border-radius:6px;color:var(--fg);font:11px var(--mono);padding:8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--accent);padding:10px 16px;border-radius:7px;z-index:60;box-shadow:0 10px 30px #000a;font-size:13px}
.rec{color:#fff;background:#d61f3e;border-color:#ff3b5c}

@media (max-width:1100px){
  #app{grid-template-columns:230px minmax(0,1fr) 280px}
  .brand small{display:none}
}
@media (max-width:900px){
  body{overflow:auto}
  #app{grid-template-columns:1fr;grid-template-rows:auto;height:auto}
  .top{flex-wrap:wrap;padding-block:10px;height:auto}
  .left,.right{border:0;border-top:1px solid var(--line);max-height:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .left{order:2}.right{order:3}
  .center{order:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:visible}
  .vp{flex:none;height:56vh}
  .tl{max-height:none}
  .mixbar{grid-template-columns:1fr auto}
  .libgrid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
  .tlhead,.row{grid-template-columns:130px minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div id="app">
  <header class="top">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M4 18C9 17 15 12 18 4"/><path d="M8 20c5-2 9-6 12-12" opacity=".55"/></svg></div>
    <div class="brand">VFX <b>FORGE</b> <small>STUDIO</small></div>
    <span class="chip">2D · 3D · v1.0</span>
    <div class="sp"></div>
    <button class="btn red" id="bReset" title="ลบทุกเลเยอร์ เริ่มงานว่าง">Reset · เริ่มงานว่าง</button>
    <button class="btn" id="bUndo" title="Ctrl+Z">↶ Undo</button>
    <button class="btn" id="bRedo" title="Ctrl+Y">↷ Redo</button>
    <button class="btn" id="bDemo" title="โหลดฉากตัวอย่าง">+ งานตัวอย่าง</button>
    <button class="btn" id="bOpen">เปิด</button>
    <button class="btn" id="bSave">บันทึก .vfx.json</button>
    <div class="drop">
      <button class="btn hot" id="bExport">ส่งออก ▾</button>
      <div class="menu" id="mExport" hidden>
        <button data-x="sheet">Sprite sheet (.png)<small>เรนเดอร์เป็นตารางเฟรม ใช้ในเกมได้ทันที</small></button>
        <button data-x="webm">วิดีโอ (.webm)<small>อัดวิดีโอจากหน้าจอพรีวิว 1 รอบ</small></button>
        <button data-x="png">ภาพนิ่งเฟรมนี้ (.png)<small>พื้นหลังโปร่งใส</small></button>
        <button data-x="json">คัดลอกโปรเจกต์ (JSON)<small>ไว้วางเก็บหรือส่งต่อ</small></button>
      </div>
    </div>
  </header>

  <aside class="left">
    <div class="ptitle">คลังเอฟเฟกต์ · <span id="libCount"></span></div>
    <div class="tabs" id="tabs">
      <button data-t="presets" class="on">สำเร็จรูป</button>
      <button data-t="elements">ชิ้นส่วน</button>
      <button data-t="sprites">สไปรต์/รูป</button>
      <button data-t="ref">ทำตามรูป</button>
      <button data-t="mine">ของฉัน</button>
    </div>
    <input class="search" id="libSearch" placeholder="ค้นหาพรีเซ็ต…" aria-label="ค้นหาพรีเซ็ต">
    <div class="hint" id="libHint">คลิกเพื่อเพิ่มทั้งเอฟเฟกต์ / ทั้งชุด</div>
    <div id="lib"></div>
  </aside>

  <main class="center">
    <div class="mixbar">
      <select class="sel" id="mixKind" aria-label="ประเภท Auto Mix">
        <option value="any">🎲 Auto Mix · สุ่มชุดสกิล</option>
        <option value="slash">ฟันดาบ (Slash)</option>
        <option value="impact">ระเบิด / กระแทก (Impact)</option>
        <option value="projectile">ยิงพลัง (Projectile)</option>
        <option value="summon">ร่ายเวท (Summon)</option>
        <option value="vortex">พายุหมุน (Vortex)</option>
        <option value="thunder">สายฟ้า (Thunder)</option>
      </select>
      <button class="btn" id="bMix">สุ่มเลย</button>
      <input class="prompt" id="prompt" placeholder="หรือพิมพ์บรรยาย เช่น “ฟันดาบสีแดง 3 เส้น มีประกายไฟ” แล้วกด Enter" aria-label="บรรยายเอฟเฟกต์">
      <button class="btn red" id="bPrompt">สร้าง</button>
    </div>
    <div class="comphead">
      <div style="flex:1;min-width:0">
        <div class="eyebrow" id="compEyebrow">Composition / 0 layers</div>
        <input class="cname" id="cname" value="Untitled mix" aria-label="ชื่องาน">
      </div>
      <div class="saved" id="saved">● AUTOSAVED</div>
    </div>
    <div class="viewbar">
      <div class="seg" id="camSeg"><button data-c="orbit" class="on">3D Orbit</button><button data-c="front">Front 2D</button></div>
      <button class="btn sm" id="bGrid">ซ่อนกริด</button>
      <button class="btn sm" id="bFocus">จัดกล้องตามเลเยอร์</button>
      <div class="sp"></div>
      <span class="note">ลากรูป PNG/JPG มาวางบนจอเพื่อเพิ่มเป็นสไปรต์</span>
    </div>
    <div class="vp" id="vp">
      <canvas id="cv"></canvas>

<script>
'use strict';
/* ============================================================ utils */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)), lerp=(a,b,t)=>a+(b-a)*t, D2R=Math.PI/180;
const ease={
  out:t=>1-Math.pow(1-t,3),
  inOut:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  expo:t=>t>=1?1:1-Math.pow(2,-10*t),
  back:t=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(t-1,3)+c*Math.pow(t-1,2);}
};
function rng(seed){let s=(seed*2654435761)>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
const uid=()=>Math.random().toString(36).slice(2,10);
const V=(x,y,z=0)=>new THREE.Vector3(x,y,z);

function h(tag,attrs={},...kids){const e=document.createElement(tag);for(const k in attrs){const v=attrs[k];if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;else if(k==='value')e.value=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v);}for(const c of kids.flat())if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(c));return e;}
function toast(msg,ms=2600){const t=h('div',{class:'toast',role:'status'},msg);document.body.append(t);setTimeout(()=>t.remove(),ms);}
const store={get(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}};

/* ============================================================ shaders */
const VS_UV=`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`;
const VS_RING=`uniform float uR,uW;varying vec2 vUv;void main(){vUv=uv;vec2 d=normalize(position.xy);gl_Position=projectionMatrix*modelViewMatrix*vec4(d*(uR+(uv.y-.5)*uW),0.,1.);}`;
const OUT=`gl_FragColor=vec4(c,clamp(max(c.r,max(c.g,c.b)),0.,1.));`;
const FR_RIB=`uniform vec3 uCore,uGlow;uniform float uHead,uTail,uOp,uSharp,uEdge,uFade;varying vec2 vUv;
void main(){float u=vUv.x;if(u>uHead||u<uTail||uHead<=uTail)discard;
float k=(u-uTail)/max(uHead-uTail,1e-4);
float d=abs(vUv.y*2.-1.-uEdge)/(1.+abs(uEdge));float a=clamp(1.-d,0.,1.);
float core=pow(a,uSharp);float g=a*a;
float f=mix(1.,smoothstep(0.,.55,k)*(1.-.5*smoothstep(.86,1.,k)),uFade);
vec3 c=(uGlow*g*.9+uCore*core*1.6)*f*uOp;${OUT}}`;
const FR_GLOW=`uniform vec3 uCore,uGlow;uniform float uOp,uRays,uRot;varying vec2 vUv;
void main(){vec2 p=vUv*2.-1.;float r=length(p);if(r>1.)discard;
float g=exp(-r*r*6.)*(1.-r);float core=exp(-r*r*50.);float ray=0.;
if(uRays>.5){float an=atan(p.y,p.x)+uRot;ray=pow(abs(cos(an*uRays*.5)),18.+160.*r)*pow(1.-r,1.5);}
vec3 c=(uGlow*(g*.9+ray*.8)+uCore*(core*1.8+ray*.6*(1.-r)))*uOp;${OUT}}`;
const FR_PTS=`varying vec4 vCol;void main(){vec2 q=gl_PointCoord*2.-1.;float d=dot(q,q);if(d>1.)discard;float a=exp(-d*3.5)*(1.-d);float hc=exp(-d*28.);vec3 c=(vCol.rgb*a+vec3(hc)*.55*a)*vCol.a;${OUT}}`;
const VS_PTS=`attribute float aSize;attribute vec4 aCol;varying vec4 vCol;uniform float uPx;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=aSize*uPx/max(.1,-mv.z);vCol=aCol;gl_Position=projectionMatrix*mv;}`;
const FR_CIRC=`uniform sampler2D uTex;uniform vec3 uCore,uGlow;uniform float uOp,uRev;varying vec2 vUv;
void main(){vec4 s=texture2D(uTex,vUv);vec2 p=vUv-.5;float an=atan(p.x,-p.y)/6.28318+.5;float m=uRev>=1.?1.:1.-smoothstep(uRev-.03,uRev,an);
vec3 c=(mix(uGlow,uCore,s.a*s.a)*s.a*1.5+uGlow*s.a*.3)*m*uOp;${OUT}}`;
const FR_SPR=`uniform sampler2D uTex;uniform vec4 uCell;uniform float uOp,uMode,uKey;uniform vec3 uTint;varying vec2 vUv;
void main(){vec2 uv=uCell.xy+clamp(vUv,.002,.998)*uCell.zw;vec4 s=texture2D(uTex,uv);
if(uMode<.5){vec3 c=s.rgb*s.a*uTint*uOp*1.1;${OUT}}
else{float a=s.a;if(uMode>1.5){float l=max(s.r,max(s.g,s.b));a*=smoothstep(uKey,uKey+.06,l);}a*=uOp;if(a<.003)discard;gl_FragColor=vec4(s.rgb*uTint*a,a);}}`;

const ADD={transparent:true,depthWrite:false,side:THREE.DoubleSide,blending:THREE.CustomBlending,blendEquation:THREE.AddEquation,blendSrc:THREE.OneFactor,blendDst:THREE.OneFactor,blendSrcAlpha:THREE.OneFactor,blendDstAlpha:THREE.OneFactor};
const NORM={...ADD,blendDst:THREE.OneMinusSrcAlphaFactor,blendDstAlpha:THREE.OneMinusSrcAlphaFactor};

function ribbonGeo(P,W,N){const n=P.length,pos=new Float32Array(n*6),uv=new Float32Array(n*4),idx=[];
  for(let i=0;i<n;i++){const p=P[i],w=W[i]/2,q=N[i];pos.set([p.x+q.x*w,p.y+q.y*w,p.z+q.z*w,p.x-q.x*w,p.y-q.y*w,p.z-q.z*w],i*6);const u=i/(n-1);uv.set([u,0,u,1],i*4);if(i<n-1){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('uv',new THREE.BufferAttribute(uv,2));g.setIndex(idx);return g;}
function ribMat(L,o={}){return new THREE.ShaderMaterial({uniforms:{uCore:{value:col(L.core)},uGlow:{value:col(L.glow)},uHead:{value:1},uTail:{value:0},uOp:{value:1},uSharp:{value:o.sharp??3},uEdge:{value:o.edge??0},uFade:{value:o.fade??1},uR:{value:1},uW:{value:.2}},vertexShader:o.vs||VS_UV,fragmentShader:FR_RIB,...ADD});}
function glowMat(L,rays=0){return new THREE.ShaderMaterial({uniforms:{uCore:{value:col(L.core)},uGlow:{value:col(L.glow)},uOp:{value:1},uRays:{value:rays},uRot:{value:0}},vertexShader:VS_UV,fragmentShader:FR_GLOW,...ADD});}
const _q=new THREE.Quaternion(),_v=new THREE.Vector3();
function billboard(o,cam){o.parent.getWorldQuaternion(_q);o.quaternion.copy(_q.invert().multiply(cam.quaternion));}
function cylBoard(o,cam){_v.copy(cam.position);o.parent.worldToLocal(_v);o.rotation.set(0,Math.atan2(_v.x,_v.z),0);}
const strand=(u,s,d)=>({u,d});
function sweepUpd(arr,t,e,sweep){for(const s of arr){const tt=clamp((t-s.d)/(1-s.d),0,1);s.u.uHead.value=ease.expo(clamp(tt/sweep,0,1));s.u.uTail.value=(s.eat??1)*ease.inOut(clamp((tt-sweep*.5)/Math.max(.02,1-sweep*.5),0,1));s.u.uOp.value=e;}}

const circCache={};
function circleTex(seed,sides,rings){const key=seed+'_'+sides+'_'+rings;if(circCache[key])return circCache[key];
  const N=512,cv=document.createElement('canvas');cv.width=cv.height=N;const x=cv.getContext('2d'),R=rng(seed);x.translate(N/2,N/2);
  x.strokeStyle='#fff';x.fillStyle='#fff';x.shadowColor='#fff';x.shadowBlur=9;x.lineCap='round';
  const ring=(r,w)=>{x.lineWidth=w;x.beginPath();x.arc(0,0,r,0,Math.PI*2);x.stroke();};
  ring(240,5);ring(226,2);ring(186,3);
  const nG=26;for(let i=0;i<nG;i++){x.save();x.rotate(i/nG*Math.PI*2);x.translate(0,-206);x.lineWidth=2.4;x.beginPath();const segs=2+((R()*3)|0);for(let s=0;s<segs;s++){x.moveTo((R()-.5)*14,(R()-.5)*16);x.lineTo((R()-.5)*14,(R()-.5)*16);}x.stroke();x.beginPath();x.arc(0,10,1.8,0,7);x.fill();x.restore();}
  const poly=(off)=>{const step=sides>=5?2:1;x.lineWidth=3;x.beginPath();for(let i=0;i<=sides;i++){const a=off-Math.PI/2+((i*step)%sides)/sides*Math.PI*2;const px=Math.cos(a)*184,py=Math.sin(a)*184;i?x.lineTo(px,py):x.moveTo(px,py);}x.stroke();};
  poly(0);if(sides<5)poly(Math.PI/sides);
  for(let i=0;i<sides;i++){const a=-Math.PI/2+i/sides*Math.PI*2;x.beginPath();x.arc(Math.cos(a)*186,Math.sin(a)*186,9,0,7);x.lineWidth=2;x.stroke();}
  for(let i=0;i<rings;i++)ring(50+i*(110/Math.max(1,rings))+R()*14,2+R()*2);
  for(let i=0;i<64;i++){x.save();x.rotate(i/64*Math.PI*2);x.lineWidth=i%4?1.2:2.6;x.beginPath();x.moveTo(0,-170);x.lineTo(0,i%4?-162:-152);x.stroke();x.restore();}
  ring(16,3);x.beginPath();x.arc(0,0,5,0,7);x.fill();
  const t=new THREE.CanvasTexture(cv);circCache[key]=t;return t;}
function floorTex(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');const g=x.createRadialGradient(128,128,0,128,128,128);g.addColorStop(0,'rgba(48,18,28,.5)');g.addColorStop(.5,'rgba(24,10,16,.3)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,256,256);return new THREE.CanvasTexture(c);}

/* ============================================================ effect types */
const sel3=(k,l,o,d)=>({k,l,t:'select',o,d}), bool=(k,l,d)=>({k,l,t:'bool',d}), colr=(k,l,d)=>({k,l,t:'color',d});
const TYPES={
slash:{label:'ฟันโค้ง · Slash',ic:'SL',
  params:[['arc','องศาความโค้ง',20,340,1,160],['radius','รัศมี',.2,6,.01,1.7],['width','ความหนา',.02,2,.01,.6],['strands','จำนวนเส้น',1,6,1,3],['crescent','ความเป็นเสี้ยวจันทร์',-1,1,.01,.6],['taper','ความเรียวปลาย',.2,3,.01,.9],['sweep','ช่วงเวลาตวัด',.05,1,.01,.35],['eat','หางไล่หาย',0,1,.01,1],['spin','หมุนตาม (องศา)',-360,360,1,40],['sharp','ความคมของแกน',1,12,.1,4]],
  build(L){const p=L.p,R=rng(L.seed),g=new THREE.Group(),arr=[];
    for(let s=0;s<p.strands;s++){const n=72,rad=p.radius*(s?1+(R()-.5)*.35:1),arc=p.arc*D2R*(s?.55+R()*.4:1),a0=-arc/2+(s?(R()-.5)*.5:0),w=p.width*(s?.16+R()*.24:1),zo=s?(R()-.5)*.12:0;
      const P=[],W=[],N=[];for(let i=0;i<n;i++){const u=i/(n-1),a=a0+arc*u,c=Math.cos(a),si=Math.sin(a);P.push(V(c*rad,si*rad,zo));N.push(V(c,si,0));W.push(w*Math.pow(Math.sin(Math.PI*u),p.taper));}
      const m=new THREE.Mesh(ribbonGeo(P,W,N),ribMat(L,{sharp:p.sharp,edge:p.crescent*(s?.3:1)}));g.add(m);arr.push({u:m.material.uniforms,d:s?R()*.15:0,eat:p.eat});}
    return{obj:g,update(t,e){sweepUpd(arr,t,e,p.sweep);g.rotation.z=-p.spin*D2R*ease.out(t);}};}},
cut:{label:'ฟันตรง · Cut',ic:'CT',
  params:[['length','ความยาว',.3,10,.01,4],['width','ความหนา',.02,1.5,.01,.4],['count','จำนวนรอย',1,8,1,1],['gap','ระยะห่างรอย',0,2,.01,.4],['jitter','ความสุ่มมุม',0,1,.01,.2],['stagger','หน่วงทีละรอย',0,.4,.01,.08],['sweep','ช่วงเวลาตวัด',.05,1,.01,.3],['taper','ความเรียวปลาย',.2,3,.01,.7],['sharp','ความคมของแกน',1,12,.1,5]],
  build(L){const p=L.p,R=rng(L.seed),g=new THREE.Group(),arr=[];
    for(let i=0;i<p.count;i++){const y0=(i-(p.count-1)/2)*p.gap,len=p.length*(1-R()*.3*p.jitter),ang=(R()-.5)*p.jitter*.5,xs=(R()-.5)*p.jitter*len*.3,n=32,P=[],W=[],N=[];
      const dx=Math.cos(ang),dy=Math.sin(ang);
      for(let j=0;j<n;j++){const u=j/(n-1),s=(u-.5)*len;P.push(V(xs+dx*s,y0+dy*s,0));N.push(V(-dy,dx,0));W.push(p.width*(i&&p.count>1?.75:1)*Math.pow(Math.sin(Math.PI*u),p.taper));}
      const m=new THREE.Mesh(ribbonGeo(P,W,N),ribMat(L,{sharp:p.sharp}));g.add(m);arr.push({u:m.material.uniforms,d:Math.min(.8,i*p.stagger)});}
    return{obj:g,update(t,e){sweepUpd(arr,t,e,p.sweep);}};}},
spikes:{label:'แฉกพุ่ง · Spikes',ic:'SP',
  params:[['count','จำนวนแฉก',1,48,1,12],['length','ความยาว',.2,8,.01,2.4],['width','ความหนา',.02,1.2,.01,.24],['jitter','ความสุ่ม',0,1,.01,.5],['spread','มุมกระจาย',5,360,1,360],['dir','ทิศทาง (องศา)',0,360,1,90],['grow','เวลาพุ่งออก',.03,1,.01,.25],['sharp','ความคมของแกน',1,12,.1,3],bool('face','หันเข้ากล้องเสมอ',true)],
  build(L){const p=L.p,R=rng(L.seed),inner=new THREE.Group(),g=new THREE.Group(),arr=[];g.add(inner);
    for(let i=0;i<p.count;i++){let a;if(p.spread>=360)a=(i/p.count+(R()-.5)*p.jitter/p.count)*Math.PI*2+p.dir*D2R;else{const st=p.spread/p.count;a=(p.dir-p.spread/2+st*(i+.5)+(R()-.5)*st*p.jitter)*D2R;}
      const len=p.length*(1-p.jitter*R()*.75),dx=Math.cos(a),dy=Math.sin(a),n=14,P=[],W=[],N=[];
      for(let j=0;j<n;j++){const u=j/(n-1);P.push(V(dx*len*u,dy*len*u,0));N.push(V(-dy,dx,0));W.push(p.width*Math.pow(1-u,.8)*Math.min(1,.25+u*5));}
      const m=new THREE.Mesh(ribbonGeo(P,W,N),ribMat(L,{sharp:p.sharp}));inner.add(m);arr.push({u:m.material.uniforms,d:R()*.12});}
    return{obj:g,update(t,e,f,cam){if(p.face)billboard(inner,cam);else inner.quaternion.identity();
      for(const s of arr){const tt=clamp((t-s.d)/(1-s.d),0,1);s.u.uHead.value=ease.expo(clamp(tt/p.grow,0,1));s.u.uTail.value=ease.inOut(clamp((tt-p.grow)/Math.max(.02,1-p.grow),0,1));s.u.uOp.value=e;}}};}},
flash:{label:'แสงวาบ · Flash',ic:'FL',
  params:[['size','ขนาด',.1,10,.01,2],['rays','จำนวนรังสี',0,16,1,6],['attack','เวลาระเบิดแสง',.01,.6,.01,.12],['decay','ความเร็วจาง',.2,4,.01,1.5],['spin','หมุน (องศา)',-360,360,1,30],['pulse','กะพริบ',0,1,.01,0]],
  build(L){const p=L.p,m=new THREE.Mesh(new THREE.PlaneGeometry(2,2),glowMat(L,p.rays)),g=new THREE.Group(),u=m.material.uniforms;g.add(m);
    return{obj:g,update(t,e,f,cam){billboard(m,cam);const a=p.attack;let s,o;if(t<a){s=ease.back(t/a);o=1;}else{const k=(t-a)/(1-a);s=1+.15*k;o=Math.pow(1-k,p.decay);}
      if(p.pulse)o*=1-p.pulse*.5*(1+Math.sin(f*.9));m.scale.setScalar(Math.max(1e-3,p.size*s));u.uOp.value=e*o;u.uRot.value=p.spin*D2R*t;}};}},
ring:{label:'คลื่นวงแหวน · Shockwave',ic:'RG',
  params:[['r0','รัศมีเริ่ม',0,4,.01,.2],['r1','รัศมีสุดท้าย',.2,12,.01,3],['width','ความหนา',.02,3,.01,.5],['count','จำนวนวง',1,5,1,2],['gap','หน่วงระหว่างวง',0,.5,.01,.14],['thin','บางลงขณะขยาย',0,1,.01,.7],['sharp','ความคมของแกน',1,12,.1,2.5],bool('ground','วางราบบนพื้น',true)],
  build(L){const p=L.p,g=new THREE.Group(),arr=[],n=128,P=[],W=[],N=[];
    for(let i=0;i<n;i++){const a=i/(n-1)*Math.PI*2;P.push(V(Math.cos(a),Math.sin(a),0));N.push(V(0,0,0));W.push(0);}
    const geo=ribbonGeo(P,W,N);for(let i=0;i<p.count;i++){const m=new THREE.Mesh(geo,ribMat(L,{vs:VS_RING,fade:0,sharp:p.sharp}));g.add(m);arr.push(m.material.uniforms);}
    if(p.ground){g.rotation.x=-Math.PI/2;g.position.y=.02;}
    return{obj:g,update(t,e){arr.forEach((u,i)=>{const d=i*p.gap,tt=clamp((t-d)/Math.max(.05,1-d),0,1);u.uR.value=lerp(p.r0,p.r1,ease.out(tt));u.uW.value=p.width*(1-p.thin*tt)*(i?.6:1);u.uOp.value=tt>0?e*Math.pow(1-tt,1.1):0;});}};}},

function fromPrompt(txt){const s=txt.toLowerCase();if(!s.trim())return;

  let pk=null;for(const [re,k] of colorMap)if(re.test(s)){pk=k;break;}const pal=PAL[pk||'crimson'];const L=[];const add=(t,o={})=>L.push(newLayer(t,{core:pal[0],glow:pal[1],...o}));

  if(/วงแหวน|คลื่น|ring|shock|wave|แรงกระแทก/.test(s))add('ring',{end:50,py:0,p:{count:2}});
  if(/หิน|แผ่นดิน|ดิน|rock|earth|debris|แตก/.test(s))add('debris',{end:80,py:0});

/* ============================================================ reference image analysis */
let REF=null;
function analyzeRef(img){const W=96,H=Math.max(8,Math.round(96*img.height/img.width)),c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(img,0,0,W,H);const d=x.getImageData(0,0,W,H).data;
  const bins=Array.from({length:12},()=>({w:0,r:0,g:0,b:0}));let sw=0,cx=0,cy=0,cr=0,cg=0,cb=0,cw=0;const pts=[];

    const s=(mx-mn)/mx;if(mx>.82){cr+=r;cg+=g;cb+=b;cw++;}if(s>.2){let hh;if(mx===r)hh=((g-b)/(mx-mn)+6)%6;else if(mx===g)hh=(b-r)/(mx-mn)+2;else hh=(r-g)/(mx-mn)+4;const bi=bins[Math.floor(hh*2)%12],ww=w*s;bi.w+=ww;bi.r+=r*ww;bi.g+=g*ww;bi.b+=b*ww;}}
  if(sw===0)return null;cx/=sw;cy/=sw;let sxx=0,syy=0,sxy=0;for(let j=0;j<pts.length;j+=3){const dx=pts[j]-cx,dy=pts[j+1]-cy,w=pts[j+2];sxx+=w*dx*dx;syy+=w*dy*dy;sxy+=w*dx*dy;}sxx/=sw;syy/=sw;sxy/=sw;
  const tr=sxx+syy,det=sxx*syy-sxy*sxy,disc=Math.sqrt(Math.max(0,tr*tr/4-det)),l1=tr/2+disc,l2=Math.max(1e-3,tr/2-disc),elong=Math.sqrt(l1/l2),ang=.5*Math.atan2(2*sxy,sxx-syy);
  const md=Math.hypot(W,H)/2,rb=new Float32Array(10),rn=new Float32Array(10);for(let j=0;j<pts.length;j+=3){const r=Math.hypot(pts[j]-cx,pts[j+1]-cy)/md,bi=Math.min(9,(r*10)|0);rb[bi]+=pts[j+2];rn[bi]++;}
  for(let y=0;y<H;y++)for(let i=0;i<W;i++){const r=Math.hypot(i-cx,y-cy)/md,bi=Math.min(9,(r*10)|0);rn[bi]+=0;}
  const dens=i=>rb[i]/Math.max(1,(2*i+1));const center=(dens(0)+dens(1))/2,ann=Math.max(dens(3),dens(4),dens(5),dens(6));const ringness=ann/Math.max(1e-3,center);
  const hex=(r,g,b)=>'#'+[r,g,b].map(v=>Math.round(clamp(v,0,1)*255).toString(16).padStart(2,'0')).join('');
  const top=bins.filter(b=>b.w>0).sort((a,b)=>b.w-a.w).slice(0,5).map(b=>{const r=b.r/b.w,g=b.g/b.w,bl=b.b/b.w,m=Math.max(r,g,bl)||1;return hex(r/m,g/m,bl/m);});
  const glow=top[0]||'#ff3355';const gc=col(glow);const core=cw?hex(Math.min(1,cr/cw*1.05),Math.min(1,cg/cw*1.05),Math.min(1,cb/cw*1.05)):hex(lerp(gc.r,1,.85),lerp(gc.g,1,.85),lerp(gc.b,1,.85));
  const cyN=cy/H,cover=pts.length/3/(W*H);let arch='burst';
  if(elong>3.2)arch='cut';else if(ringness>1.25&&elong<1.7)arch='ring';else if(elong>1.45)arch='slash';else if(cyN>.58)arch='eruption';
  return{glow,core,palette:top.length?top:[glow],elong,ang:-ang/D2R,ringness,cyN,cover,arch};}
const ARCH_TH={cut:'รอยฟันตรง / หอกแสง',ring:'วงแหวน / วงเวท',slash:'ฟันโค้งเสี้ยวจันทร์',eruption:'ระเบิดจากพื้น / เสาพลัง',burst:'ระเบิดแสงกระจาย'};

      const mv=ev=>{const df=Math.round((ev.clientX-x0)/tw*F);if(mode==='m'){const len=e0-s0;L.start=clamp(s0+df,0,Math.max(0,F-len));L.end=L.start+len;}else if(mode==='l')L.start=clamp(s0+df,0,e0-1);else L.end=clamp(e0+df,s0+1,F);bar.style.left=L.start/F*100+'%';bar.style.width=(L.end-L.start)/F*100+'%';bar.textContent=L.start+'–'+L.end;};
      const up=()=>{bar.removeEventListener('pointermove',mv);bar.removeEventListener('pointerup',up);renderInsp();commit();};bar.addEventListener('pointermove',mv);bar.addEventListener('pointerup',up);});
    rows.append(row);});
  rows.append(h('div',{class:'ph',id:'ph'}));
  $('#tlInfo').textContent='เลือก '+sel.size+' เลเยอร์';$('#compEyebrow').textContent='Composition / '+ST.layers.length+' layers';$('#lSolo').classList.toggle('on',!!solo);updPh();}
function updPh(){const ph=$('#ph');if(!ph)return;const ru=$('#ruler').getBoundingClientRect(),rr=$('#rows').getBoundingClientRect();ph.style.left=(ru.left-rr.left+$('#rows').scrollLeft+frame/ST.comp.frames*ru.width)+'px';ph.style.height=Math.max($('#rows').scrollHeight,$('#rows').clientHeight)+'px';}
function scrubAt(e){const r=$('#ruler').getBoundingClientRect();frame=clamp((e.clientX-r.left)/r.width,0,1)*ST.comp.frames;playing=false;updPlay();}
$('#ruler').addEventListener('pointerdown',e=>{scrubAt(e);const mv=ev=>scrubAt(ev),up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);};window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);});
function refreshAll(){applyComp();renderTL();renderInsp();}

/* ============================================================ transport */

$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;

$('#bOpen').onclick=()=>$('#fOpen').click();

  if(k===' '){e.preventDefault();$('#tPlay').click();}else if(k==='arrowleft'){e.preventDefault();$('#tPrev').click();}else if(k==='arrowright'){e.preventDefault();$('#tNext').click();}
  else if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();}else if((e.ctrlKey||e.metaKey)&&k==='y'){e.preventDefault();redo();}
  else if((e.ctrlKey||e.metaKey)&&k==='d'){e.preventDefault();dupSel();}else if(k==='delete'||k==='backspace'){delSel();}else if(k==='escape'){closeModal();}});

/* ============================================================ save / export */
const slug=s=>(s||'vfx').trim().replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'').toLowerCase()||'vfx';
function projectJSON(){const used={};ST.layers.forEach(l=>{if(l.type==='sprite'&&ASSETS[l.p.asset]){const A=ASSETS[l.p.asset];used[A.id]={id:A.id,name:A.name,src:A.src,cols:A.cols,rows:A.rows};}});return JSON.stringify({app:'vfx-forge',v:1,comp:ST.comp,layers:ST.layers,assets:{...userAssets(),...used}});}
function loadProject(d){if(!d||!Array.isArray(d.layers))throw new Error('bad');for(const id in d.assets||{})if(!ASSETS[id])addAsset(d.assets[id]);ST={comp:{...COMP0,...d.comp},layers:d.layers.filter(l=>TYPES[l.type])};
  ST.layers.forEach(l=>{if(l.type==='sprite'&&l.p&&l.p.asset==='s_hero'){l.p.asset='s_ninja';l.p.blend='normal';l.name=l.name.replace('Swordswoman','Ninja');}});
  ST.layers.forEach(l=>{const def=newLayer(l.type);for(const k in def)if(l[k]==null)l[k]=def[k];for(const k in def.p)if(l.p[k]==null)l.p[k]=def.p[k];});sel.clear();primary=null;frame=0;main.build(ST.layers);refreshAll();}
let dlNS;const dlReady=(window.claude&&window.claude.use)?window.claude.use('downloads').then(d=>dlNS=d,()=>dlNS=null):Promise.resolve(dlNS=null);
async function saveFile(name,blob){await dlReady;if(dlNS){try{await dlNS.save({filename:name,data:blob});toast('บันทึก '+name);}catch(e){if(e&&e.code!=='declined')toast('บันทึกไฟล์ไม่ได้ในหน้านี้ · คลิกขวาที่รูปเพื่อบันทึกแทน');}return;}
  const url=URL.createObjectURL(blob);const a=h('a',{href:url,download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);toast('บันทึก '+name);}
function closeModal(){$('#modal').hidden=true;}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
function modal(...kids){const d=$('#dlg');d.innerHTML='';d.append(...kids);$('#modal').hidden=false;}
function openExport(kind){
  if(kind==='json'){const ta=h('textarea',{readonly:true},projectJSON());modal(h('h2',{},'โปรเจกต์ (JSON)'),h('div',{class:'note'},'คัดลอกไปเก็บไว้ หรือกด “บันทึก .vfx.json” ที่แถบบน · เปิดกลับได้ด้วยปุ่ม “เปิด”'),h('div',{style:'height:10px'}),ta,h('div',{class:'acts'},h('button',{class:'btn',onclick:closeModal},'ปิด'),h('button',{class:'btn red',onclick:()=>{navigator.clipboard.writeText(ta.value).then(()=>toast('คัดลอกแล้ว'),()=>{ta.select();toast('กด Ctrl+C เพื่อคัดลอก');});}},'คัดลอก')));return;}
  if(kind==='png'){const c=renderStill();modal(h('h2',{},'ภาพนิ่งเฟรม '+Math.floor(frame)),h('div',{style:'height:10px'}),h('img',{class:'out',src:c.toDataURL('image/png'),alt:'ภาพนิ่ง'}),h('div',{class:'acts'},h('span',{class:'note',style:'margin-right:auto'},'คลิกขวาที่รูป › บันทึกรูปภาพ ก็ได้'),h('button',{class:'btn',onclick:closeModal},'ปิด'),h('button',{class:'btn red',onclick:()=>c.toBlob(b=>saveFile(slug(ST.comp.name)+'-f'+Math.floor(frame)+'.png',b))},'ดาวน์โหลด PNG')));return;}
  if(kind==='webm')return recordWebm();
  const F=ST.comp.frames,inp=(id,lab,v,extra={})=>h('label',{class:'f'},lab,h('input',{id,type:'number',value:v,...extra}));
  const bg=h('select',{id:'xBg'},h('option',{value:'black'},'ดำ (ใช้ Additive ในเกม)'),h('option',{value:'transparent'},'โปร่งใส (ไม่มี Bloom)'),h('option',{value:'comp'},'สีพื้นหลังของฉาก'));
  const out=h('div');
  modal(h('h2',{},'ส่งออก Sprite sheet'),h('div',{class:'note'},'เรนเดอร์จากมุมกล้องปัจจุบัน แต่ละช่องเป็นสี่เหลี่ยมจัตุรัส · Unity/Godot/Phaser ตั้งค่า slice ตามจำนวนคอลัมน์และแถว'),
    h('div',{class:'row2'},inp('xN','จำนวนเฟรม',16,{min:1,max:256}),inp('xC','คอลัมน์',4,{min:1,max:32}),inp('xS','ขนาดต่อช่อง (px)',256,{min:32,max:1024,step:32}),h('label',{class:'f'},'พื้นหลัง',bg),inp('xF0','เริ่มที่เฟรม',0,{min:0,max:F}),inp('xF1','จบที่เฟรม',F,{min:0,max:F}),inp('xZ','ซูมเข้า (เท่า)',1.6,{min:.5,max:6,step:.1})),
    out,h('div',{class:'acts'},h('button',{class:'btn',onclick:closeModal},'ปิด'),h('button',{class:'btn red',id:'xGo',onclick:async()=>{const o={n:clamp(+$('#xN').value|0,1,256),cols:clamp(+$('#xC').value|0,1,32),cell:clamp(+$('#xS').value|0,32,1024),bg:bg.value,f0:+$('#xF0').value,f1:+$('#xF1').value,zoom:clamp(+$('#xZ').value||1,.5,6)};
      $('#xGo').disabled=true;$('#xGo').textContent='กำลังเรนเดอร์…';const c=await exportSheet(o);$('#xGo').disabled=false;$('#xGo').textContent='เรนเดอร์ใหม่';out.innerHTML='';
      const rows=Math.ceil(o.n/o.cols);out.append(h('div',{class:'note',style:'margin-bottom:8px'},`${c.width}×${c.height}px · ${o.cols} คอลัมน์ × ${rows} แถว · ${o.n} เฟรม`),h('img',{class:'out',src:c.toDataURL('image/png'),alt:'Sprite sheet'}),h('div',{class:'acts'},h('span',{class:'note',style:'margin-right:auto'},'คลิกขวาที่รูป › บันทึกรูปภาพ ก็ได้'),h('button',{class:'btn red',onclick:()=>c.toBlob(b=>saveFile(slug(ST.comp.name)+`-sheet-${o.cols}x${rows}.png`,b))},'ดาวน์โหลด PNG')));}},'เรนเดอร์')));}
function offStage(size,bg,bloom,zoom=1){const st=new Stage(size[0],size[1],{bloom,preserve:true});st.camera.fov=2*Math.atan(Math.tan(main.camera.fov*D2R/2)/zoom)/D2R;st.camera.position.copy(main.camera.position);st.camera.quaternion.copy(main.camera.quaternion);st.setSize(size[0],size[1]);st.grid.visible=st.floor.visible=false;
  if(bg==='transparent'){st.scene.background=null;st.renderer.setClearColor(0x000000,0);}else st.scene.background=new THREE.Color(bg==='black'?'#000000':ST.comp.bg);st.build(ST.layers);return st;}
async function exportSheet(o){const rows=Math.ceil(o.n/o.cols),out=h('canvas');out.width=o.cols*o.cell;out.height=rows*o.cell;const x=out.getContext('2d');const st=offStage([o.cell,o.cell],o.bg,o.bg!=='transparent',o.zoom);
  for(let i=0;i<o.n;i++){const f=o.n>1?o.f0+(o.f1-o.f0)*i/(o.n-1):o.f0;st.evaluate(f);st.render(true);x.drawImage(st.canvas,(i%o.cols)*o.cell,Math.floor(i/o.cols)*o.cell);if(i%6===5)await new Promise(r=>setTimeout(r));}
  st.dispose();return out;}
function renderStill(){const w=main.w,hh=main.h,st=offStage([w,hh],'transparent',false);st.evaluate(frame);st.render(false);const c=h('canvas');c.width=w;c.height=hh;c.getContext('2d').drawImage(st.canvas,0,0);st.dispose();return c;}
let rec=null;
function recordWebm(){if(!window.MediaRecorder||!main.canvas.captureStream)return toast('เบราว์เซอร์นี้อัดวิดีโอไม่ได้ ลองใช้ Chrome');const stream=main.canvas.captureStream(60),mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';
  const mr=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:12e6}),chunks=[];mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  mr.onstop=()=>{const b=new Blob(chunks,{type:'video/webm'});$('#bExport').classList.remove('rec');$('#bExport').textContent='ส่งออก ▾';const url=URL.createObjectURL(b);
    modal(h('h2',{},'วิดีโอพร้อมแล้ว'),h('div',{style:'height:10px'}),h('video',{src:url,controls:true,loop:true,autoplay:true,muted:true,style:'width:100%;border-radius:6px;background:#000'}),h('div',{class:'acts'},h('button',{class:'btn',onclick:closeModal},'ปิด'),h('button',{class:'btn red',onclick:()=>saveFile(slug(ST.comp.name)+'.webm',b)},'ดาวน์โหลด .webm')));};
  frame=0;playing=true;loopOn=false;$('#tLoop').checked=false;updPlay();rec={mr,done:false};mr.start();$('#bExport').classList.add('rec');$('#bExport').textContent='● กำลังอัด…';toast('กำลังอัดวิดีโอ 1 รอบ…');}

function loadDemo(){const H=ASSETS.s_ninja,SL=ASSETS.s_slash;const pal=PAL.crimson;ST={comp:{...COMP0,name:'Crimson Ninja · Combo 1',frames:72},layers:[]};const L=[];
  if(SL)L.push(newLayer('sprite',{name:'Slash art · ชีตฟัน #0',start:6,end:40,px:.9,py:1.15,pz:.2,fadeIn:.05,fadeOut:.4,core:'#ffffff',p:{asset:SL.id,cols:6,rows:3,from:0,to:0,blend:'add',size:2.6,s0:.7,s1:1.25,spin:-20,board:'cyl'}}));
  L.push(newLayer('slash',{name:'Crescent · ฟันโค้ง',start:4,end:40,px:.8,py:1.1,rz:-30,core:pal[0],glow:pal[1],p:{arc:165,radius:1.5,width:.55,strands:3}}));
  L.push(newLayer('particles',{name:'Sparks · ประกาย',start:8,end:52,px:1.6,py:1,core:pal[0],glow:pal[1],p:{count:90,speed:6,size:.07,gravity:3}}));
  L.push(newLayer('flash',{name:'Hit flash · แสงวาบ',start:8,end:30,px:1.8,py:1.1,core:pal[0],glow:pal[1],p:{size:1.5,rays:4}}));
  L.push(newLayer('ring',{name:'Ground ring · คลื่นพื้น',start:8,end:44,px:1.4,py:0,core:pal[0],glow:pal[1],p:{r1:2.2,count:1}}));
  if(H)L.push(newLayer('sprite',{name:'Ninja · ตัวละคร',start:0,end:72,px:-1.1,py:0,fadeOut:0,core:'#ffffff',p:{asset:H.id,cols:6,rows:4,from:6,to:11,hold:6,blend:'normal',size:2.2,pivot:'bottom',board:'cyl'}}));
  ST.layers=L;sel.clear();primary=null;frame=0;playing=true;main.build(ST.layers);refreshAll();}
(window.VFX_SAMPLES||[]).forEach(s=>addAsset(s,true));
(function boot(){const saved=store.get('vfxforge.project');let ok=false;
  if(saved&&Array.isArray(saved.layers)){try{for(const id in saved.assets||{})if(!ASSETS[id])addAsset(saved.assets[id]);loadProject(saved);ok=true;}catch(e){ok=false;}}
  const go=()=>{if(!ok)loadDemo();commit();setTab();updPlay();requestAnimationFrame(tick);};
  Promise.all(Object.values(ASSETS).map(waitImg)).then(go);})();

let lastT=performance.now(),fpsAcc=0,fpsN=0,lastFloor=-1;
function tick(now){const dt=Math.min(.1,(now-lastT)/1000);lastT=now;fpsAcc+=dt;fpsN++;
  if(playing){frame+=dt*ST.comp.fps*speed;if(frame>ST.comp.frames){if(rec&&!rec.done){rec.done=true;frame=ST.comp.frames;playing=false;updPlay();setTimeout(()=>{rec.mr.stop();rec=null;},120);}else if(loopOn)frame%=ST.comp.frames;else{frame=ST.comp.frames;playing=false;updPlay();}}}
  main.evaluate(frame);controls.update();main.render();
  const fl=Math.floor(frame);if(fl!==lastFloor){lastFloor=fl;$('#tFrame').textContent=fl+' / '+ST.comp.frames+' f';}updPh();
  if(fpsAcc>.5){$('#stat').textContent=Math.round(fpsN/fpsAcc)+' fps · '+ST.layers.length+' layers';fpsAcc=0;fpsN=0;}
  requestAnimationFrame(tick);}
